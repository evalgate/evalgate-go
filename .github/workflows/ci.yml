name: Go SDK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test -v ./...
      - run: go vet ./...
  installed-module:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install the public module in an independent consumer
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/evalgate-consumer"
          cd "$RUNNER_TEMP/evalgate-consumer"
          go mod init example.com/sdk-consumer
          go get "github.com/evalgate/evalgate-go/v3@$GITHUB_REF_NAME"
          cat > main.go <<'GO'
          package main
          import (
            "fmt"
            evalgate "github.com/evalgate/evalgate-go/v3"
          )
          func main() {
            if _, err := evalgate.NewClient(evalgate.Config{APIKey: "install-smoke-no-network"}); err != nil { panic(err) }
            fmt.Println(evalgate.Version, evalgate.SpecVersion)
          }
          GO
          go run .
